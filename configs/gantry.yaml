# Gantry plant + RL environment configuration.
# Units are SI throughout (m, kg, s, rad, N, N·m). Symbols follow model.tex.
#
# Default values describe a generic small belt-driven (CoreXY-style) gantry:
# GT2 belts on 20-tooth pulleys driven directly by small servos. They are
# plausible placeholders, not identified values.

# ---------------------------------------------------------------- plant model
model:
  inertia:
    m_x: 0.5        # [kg]      effective mass moving in x (carriage)
    m_y: 1.2        # [kg]      effective mass moving in y (carriage + x-beam)
    I_A: 1.0e-5     # [kg m^2]  servo A rotor + pulley
    I_B: 1.0e-5     # [kg m^2]  servo B rotor + pulley

  belts:            # r: signed effective radius = pitch radius / gear ratio
    A: {r: 6.366e-3, kappa: 2.0e4, c: 10.0, L: 2.5, ell0: 0.6}
    B: {r: 6.366e-3, kappa: 2.0e4, c: 10.0, L: 2.5, ell0: 0.6}
    #   r [m], kappa = E*A [N], c [N s/m], L total length [m], ell0 short span at x=y=0 [m]

  friction:         # phi(v) = [F_c + (F_s - F_c) exp(-(v/v_s)^2)] tanh(v/v_eps) + b v
    x: {F_c: 2.0,   F_s: 2.5,   v_s: 0.01, v_eps: 1.0e-3, b: 5.0}     # N, m/s, N s/m
    y: {F_c: 3.0,   F_s: 3.8,   v_s: 0.01, v_eps: 1.0e-3, b: 8.0}
    A: {F_c: 4.0e-3, F_s: 5.0e-3, v_s: 0.5, v_eps: 0.05,  b: 1.0e-5}  # N m, rad/s, N m s/rad
    B: {F_c: 4.0e-3, F_s: 5.0e-3, v_s: 0.5, v_eps: 0.05,  b: 1.0e-5}

# --------------------------------------------------------------- environment
env:
  control_dt: 2.0e-3        # [s] policy period (500 Hz), zero-order hold on torque
  episode_time: 1.5         # [s]
  tau_max: [0.2, 0.2]       # [N m] torque limit; action in [-1, 1] maps to [-tau_max, tau_max]
  workspace: 0.15           # [m] episode terminates if |x| or |y| exceeds this

  integrator:
    method: rk4             # rk4 (fixed-step, fast: training) | kvaerno5 | tsit5 (adaptive: validation)
    substeps: 20            # rk4 steps per control period (h = 0.1 ms)
    rtol: 1.0e-6            # adaptive methods only
    atol: 1.0e-9
    max_steps: 4096

# --------------------------------------------------------------------- tasks
# References come from a reduced-order (rigid-belt) planner so they are
# dynamically feasible: the CLF-RL "model-based reference" (cf. H-LIP / HZD
# in the paper). See gantry_sim/planner.py.
task:
  p_trajectory: 0.5         # probability an episode is trajectory tracking (else setpoints)
  ref_bound: 0.12           # [m] references stay inside |x|,|y| <= ref_bound
  setpoint:
    hold_time: 0.5          # [s] a new random goal every hold_time
    min_move_time: 0.05     # [s] minimum-jerk move durations are searched in
    max_move_time: 0.4      # [s]   [min, max]; the shortest feasible one is used
  trajectory:               # sum of sinusoids per axis, amplitude scaled down until feasible
    n_harmonics: 2
    freq: [0.2, 1.5]        # [Hz]
    amp_max: 0.08           # [m] max total amplitude per axis
  init_noise: 0.0005        # [m] initial position offset from the reference

planner:
  torque_margin: 0.6        # plan with <= this fraction of tau_max on the NOMINAL rigid model,
                            # leaving headroom for randomised plants and feedback

# -------------------------------------------------------------- observations
observation:
  history: 4                # encoder frames stacked for the actor
  preview_steps: [5, 20]    # future reference samples given to the actor (control steps ahead)
  actor_reference: planned  # planned: actor sees the planner's reference (planner runs at deployment)
                            # command: actor sees only the commanded goal / trajectory (paper style:
                            #          reference used for the reward only)
  encoder_cpr: 16384        # counts per revolution (quantisation)
  encoder_noise_std: 2.0e-4 # [rad] additive noise before quantisation
  pos_scale: 0.1            # [m]     observation scaling
  vel_scale: 0.5            # [m/s]
  acc_scale: 10.0           # [m/s^2] critic-only
  stretch_scale: 5.0e-4     # [m]     critic-only

# -------------------------------------------------------------------- reward
# Computed from the TRUE carriage state (privileged), never from encoders.
reward:
  mode: clf                 # clf (CLF-RL) | heuristic (hand-shaped baseline)

  # CLF-RL. eta = [p_d - p; v_d - v],  V = eta^T P eta,  P from the CARE of the
  # double integrator (A = [0 I; 0 0], B = [0; I]) with Q = diag(Q_pos I, Q_vel I), R I.
  #   r_v    = w_v exp(-V / sigma_v),                      sigma_v    = mu_max(P) eta_max^2
  #   r_vdot = -w_vdot clip((Vdot + lambda V) / sigma_vdot, 0, 1),
  #                      sigma_vdot = 2 ||P|| eta_max eta_dot_max + lambda mu_max(P) eta_max^2
  #   r_reg  = -w_torque |u / tau_max|^2 - w_action_rate |a - a_prev|^2
  # Defaults: Q, R = critically damped LQR at 30 rad/s (1 mm ~ 30 mm/s in V).
  clf:
    Q_pos: 8.1e5
    Q_vel: 1.8e3
    R: 1.0
    decay_rate: 10.0        # lambda [1/s], desired exponential decay rate of V
    eta_max: 5.0e-3         # empirical tracking-error bound (sets sigma_v)
    eta_dot_max: 0.5        # empirical bound on |d eta / dt| (sets sigma_vdot)
    w_v: 10.0               # paper Table I
    w_vdot: 2.0             # paper Table I; 0 -> "tracking only" ablation
    w_torque: 0.1
    w_action_rate: 0.5
    w_terminate: 100.0
    # Calibrated scales (override the formulas above; null -> use the formulas).
    # With this ill-conditioned P (m vs m/s) the paper's formulas are loose:
    # sigma_v = 1.35, sigma_vdot = 284. Measured on the PD baseline:
    # p95 |Vdot| = 23, so sigma_vdot = 25 lets the decay penalty actually saturate.
    # sigma_v = 0.2 (~2 mm position-equivalent) keeps r_v informative at the
    # ~0.5-1 mm errors trained policies reach (1.35 was nearly flat there).
    sigma_v: 0.2
    sigma_vdot: 25.0

  # Baseline: r = w_pos exp(-|e|/sigma_pos) + w_precision exp(-(|e|/sigma_precision)^2)
  #              - w_vel (|e_v|/vel_scale)^2 - w_torque |a|^2 - w_action_rate |a - a_prev|^2
  heuristic:
    w_pos: 1.0
    sigma_pos: 0.05
    w_precision: 1.0
    sigma_precision: 0.003
    w_vel: 0.05
    w_torque: 0.01
    w_action_rate: 0.05
    w_terminate: 50.0

# --------------------------------------------------------- domain randomisation
# Each parameter is multiplied by U(1 - frac, 1 + frac), sampled per episode.
# Paths are attribute paths into GantryParams.
randomization:
  enabled: true
  scale:
    m_x: 0.2
    m_y: 0.2
    I_A: 0.2
    I_B: 0.2
    belt_A.kappa: 0.3
    belt_B.kappa: 0.3
    belt_A.c: 0.5
    belt_B.c: 0.5
    fric_x.F_c: 0.5
    fric_x.F_s: 0.5
    fric_x.b: 0.5
    fric_y.F_c: 0.5
    fric_y.F_s: 0.5
    fric_y.b: 0.5
    fric_A.F_c: 0.5
    fric_A.F_s: 0.5
    fric_B.F_c: 0.5
    fric_B.F_s: 0.5
